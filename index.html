<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EPUB Reader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --color-white: rgba(255, 255, 255, 1);
            --color-black: rgba(0, 0, 0, 1);
            --color-cream-50: rgba(252, 252, 249, 1);
            --color-cream-100: rgba(255, 255, 253, 1);
            --color-gray-200: rgba(245, 245, 245, 1);
            --color-gray-300: rgba(167, 169, 169, 1);
            --color-gray-400: rgba(119, 124, 124, 1);
            --color-slate-500: rgba(98, 108, 113, 1);
            --color-brown-600: rgba(94, 82, 64, 1);
            --color-charcoal-700: rgba(31, 33, 33, 1);
            --color-charcoal-800: rgba(38, 40, 40, 1);
            --color-slate-900: rgba(19, 52, 59, 1);
            --color-teal-300: rgba(50, 184, 198, 1);
            --color-teal-400: rgba(45, 166, 178, 1);
            --color-teal-500: rgba(33, 128, 141, 1);
            --color-teal-600: rgba(29, 116, 128, 1);
            --color-teal-700: rgba(26, 104, 115, 1);
            --color-teal-800: rgba(41, 150, 161, 1);
            
            --color-background: var(--color-cream-50);
            --color-surface: var(--color-cream-100);
            --color-text: var(--color-slate-900);
            --color-text-secondary: var(--color-slate-500);
            --color-primary: var(--color-teal-500);
            --color-primary-hover: var(--color-teal-600);
            --color-primary-active: var(--color-teal-700);
            --color-secondary: rgba(94, 82, 64, 0.12);
            --color-border: rgba(94, 82, 64, 0.2);
            --color-btn-primary-text: var(--color-cream-50);
            
            --font-family-base: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-family-mono: 'Courier New', monospace;
            --font-size-base: 14px;
            --font-size-sm: 12px;
            --font-size-md: 14px;
            --font-size-lg: 16px;
            --font-size-xl: 18px;
            --font-size-2xl: 20px;
            --font-size-3xl: 24px;
            --font-weight-normal: 400;
            --font-weight-medium: 500;
            --font-weight-semibold: 550;
            --font-weight-bold: 600;
            --line-height-tight: 1.2;
            --line-height-normal: 1.5;
            
            --space-4: 4px;
            --space-8: 8px;
            --space-12: 12px;
            --space-16: 16px;
            --space-20: 20px;
            --space-24: 24px;
            --space-32: 32px;
            
            --radius-sm: 6px;
            --radius-base: 8px;
            --radius-md: 10px;
            --radius-lg: 12px;
            
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04), 0 1px 2px rgba(0, 0, 0, 0.02);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.04), 0 2px 4px -1px rgba(0, 0, 0, 0.02);
            
            --duration-normal: 250ms;
            --ease-standard: cubic-bezier(0.16, 1, 0.3, 1);
        }

        * {
            box-sizing: border-box;
        }

        html {
            font-size: var(--font-size-base);
            font-family: var(--font-family-base);
            line-height: var(--line-height-normal);
            color: var(--color-text);
            background-color: var(--color-background);
            -webkit-font-smoothing: antialiased;
        }

        body {
            margin: 0;
            padding: 0;
        }

        h1, h2, h3, h4, h5, h6 {
            margin: 0;
            font-weight: var(--font-weight-semibold);
            line-height: var(--line-height-tight);
            color: var(--color-text);
        }

        h1 { font-size: var(--font-size-3xl); }
        h2 { font-size: var(--font-size-2xl); }
        h3 { font-size: var(--font-size-xl); }

        p {
            margin: 0 0 var(--space-16) 0;
        }

        a {
            color: var(--color-primary);
            text-decoration: none;
            transition: color var(--duration-normal) var(--ease-standard);
        }

        a:hover {
            color: var(--color-primary-hover);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: var(--space-8) var(--space-16);
            border-radius: var(--radius-base);
            font-size: var(--font-size-base);
            font-weight: 500;
            line-height: 1.5;
            cursor: pointer;
            transition: all var(--duration-normal) var(--ease-standard);
            border: none;
            text-decoration: none;
            position: relative;
        }

        .btn:focus-visible {
            outline: 2px solid var(--color-primary);
            outline-offset: 2px;
        }

        .btn--primary {
            background: var(--color-primary);
            color: var(--color-btn-primary-text);
        }

        .btn--primary:hover {
            background: var(--color-primary-hover);
        }

        .btn--primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn--secondary {
            background: var(--color-secondary);
            color: var(--color-text);
            border: 1px solid var(--color-border);
        }

        .btn--secondary:hover:not(:disabled) {
            background: rgba(94, 82, 64, 0.2);
        }

        .btn--secondary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .form-control {
            display: block;
            width: 100%;
            padding: var(--space-8) var(--space-12);
            font-size: var(--font-size-md);
            line-height: 1.5;
            color: var(--color-text);
            background-color: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-base);
            transition: border-color var(--duration-normal) var(--ease-standard);
        }

        .form-control:focus {
            border-color: var(--color-primary);
            outline: 2px solid var(--color-primary);
            outline-offset: 0;
        }

        .form-group {
            margin-bottom: var(--space-16);
        }

        .form-label {
            display: block;
            margin-bottom: var(--space-8);
            font-weight: var(--font-weight-medium);
            font-size: var(--font-size-sm);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: var(--space-16);
        }

        header {
            background: var(--color-surface);
            border-bottom: 1px solid var(--color-border);
            padding: var(--space-16) 0;
            margin-bottom: var(--space-24);
        }

        header h1 {
            margin: 0;
            font-size: var(--font-size-2xl);
        }

        .header-content {
            max-width: 900px;
            margin: 0 auto;
            padding: 0 var(--space-16);
        }

        .upload-section {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-20);
            margin-bottom: var(--space-24);
        }

        .reader-section {
            display: none;
        }

        .reader-section.active {
            display: block;
        }

        .chapter-content {
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-24);
            margin-bottom: var(--space-24);
            line-height: 1.8;
            font-size: var(--font-size-lg);
        }

        .chapter-content h1,
        .chapter-content h2,
        .chapter-content h3 {
            margin-top: var(--space-24);
            margin-bottom: var(--space-16);
        }

        .chapter-content h1:first-child {
            margin-top: 0;
        }

        .chapter-content img {
            max-width: 100%;
            height: auto;
            border-radius: var(--radius-md);
            margin: var(--space-20) 0;
        }

        .chapter-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-20);
            padding-bottom: var(--space-16);
            border-bottom: 1px solid var(--color-border);
        }

        .chapter-title {
            font-size: var(--font-size-2xl);
            font-weight: var(--font-weight-semibold);
            margin: 0;
        }

        .chapter-info {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .navigation {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-16);
            margin-bottom: var(--space-24);
        }

        .nav-button {
            flex: 1;
        }

        .nav-center {
            text-align: center;
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
            flex: 2;
        }

        .loading {
            text-align: center;
            padding: var(--space-32);
            color: var(--color-text-secondary);
        }

        .error {
            background: rgba(192, 21, 47, 0.1);
            border: 1px solid rgba(192, 21, 47, 0.3);
            color: rgba(192, 21, 47, 1);
            padding: var(--space-16);
            border-radius: var(--radius-base);
            margin-bottom: var(--space-16);
        }

        .success {
            background: rgba(33, 128, 141, 0.1);
            border: 1px solid rgba(33, 128, 141, 0.3);
            color: rgba(33, 128, 141, 1);
            padding: var(--space-16);
            border-radius: var(--radius-base);
            margin-bottom: var(--space-16);
        }

        .book-info {
            margin-top: var(--space-20);
            padding: var(--space-16);
            background: var(--color-secondary);
            border-radius: var(--radius-md);
            font-size: var(--font-size-sm);
        }

        .book-info strong {
            font-weight: var(--font-weight-semibold);
        }

        .library-section {
            display: none;
        }

        .library-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: var(--space-16);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-lg);
            padding: var(--space-16);
            margin-bottom: var(--space-12);
        }

        .library-item-title {
            font-weight: var(--font-weight-semibold);
            font-size: var(--font-size-lg);
        }

        .library-item-meta {
            font-size: var(--font-size-sm);
            color: var(--color-text-secondary);
        }

        .library-item-actions {
            display: flex;
            gap: var(--space-8);
            flex-shrink: 0;
        }

        .library-link {
            display: inline-block;
            margin-bottom: var(--space-16);
        }
    </style>
</head>
<body>
    <header>
        <div class="header-content">
            <h1>📖 EPUB Reader</h1>
        </div>
    </header>
    <center>
<iframe src="https://widget.ekomalopolska.pl/aqwidget.php?id=114&theme=classic" style="width:300px;height:150px;border:0;overflow:hidden;"></iframe>
<iframe src="https://widget.ekomalopolska.pl/aqwidget.php?id=1377&theme=classic" style="width:300px;height:150px;border:0;overflow:hidden;"></iframe>
</center>
    <div class="container">
        <!-- Upload Section -->
        <div class="upload-section" id="uploadSection">
            <h2 style="margin-top: 0;">Load EPUB File</h2>
            <div class="form-group">
                <label for="epubFile" class="form-label">Select EPUB File:</label>
                <input 
                    type="file" 
                    id="epubFile" 
                    accept=".epub" 
                    class="form-control"
                >
            </div>
            <div id="uploadStatus"></div>
            <div id="bookInfo"></div>
            <a href="#library">📚 Library</a>
        </div>

        <!-- Library Section -->
        <div class="library-section" id="librarySection">
            <h2 style="margin-bottom: var(--space-16);">Library</h2>
            <a href="#" class="library-link" id="libraryBackLink">← Back to reader</a>
            <div id="libraryList"></div>
        </div>

        <!-- Reader Section -->
        <div class="reader-section" id="readerSection">
            <a href="#library" class="library-link">📚 Library</a>
            <div class="navigation">
                <button class="btn btn--secondary nav-button" id="prevBtn">← Previous</button>
                <div class="nav-center" id="chapterNav">Chapter 1 of 1</div>
                <button class="btn btn--secondary nav-button" id="nextBtn">Next →</button>
            </div>

            <div id="loadingIndicator" class="loading" style="display: none;">Loading chapter...</div>
            <div id="chapterContent" class="chapter-content"></div>

            <div class="navigation">
                <button class="btn btn--secondary nav-button" id="prevBtn2">← Previous</button>
                <div class="nav-center">
                    <button class="btn btn--primary" id="backBtn">Load Different File</button>
                </div>
                <button class="btn btn--secondary nav-button" id="nextBtn2">Next →</button>
            </div>
        </div>
    </div>

    <script>
        class EPUBReader {
            constructor() {
                this.epub = null;
                this.chapters = [];
                this.currentChapterIndex = 0;
                this.fileHash = null;
            }

            // Generate a simple id for the file (hash of its start + size)
            async generateFileHash(file) {
                const buffer = await file.slice(0, 10000).arrayBuffer();
                const array = new Uint8Array(buffer);
                let hash = 0;
                for (let i = 0; i < array.length; i++) {
                    hash = ((hash << 5) - hash) + array[i];
                    hash = hash & hash;
                }
                return Math.abs(hash).toString(36) + '-' + file.size;
            }

            // Persistent storage (IndexedDB)
            openDb() {
                if (!this.dbPromise) {
                    this.dbPromise = new Promise((resolve, reject) => {
                        const req = indexedDB.open('epubReader', 1);
                        req.onupgradeneeded = () => req.result.createObjectStore('books', { keyPath: 'id' });
                        req.onsuccess = () => resolve(req.result);
                        req.onerror = () => reject(req.error);
                    });
                }
                return this.dbPromise;
            }

            async dbRequest(mode, fn) {
                const db = await this.openDb();
                return new Promise((resolve, reject) => {
                    const tx = db.transaction('books', mode);
                    const req = fn(tx.objectStore('books'));
                    tx.oncomplete = () => resolve(req.result);
                    tx.onerror = () => reject(tx.error);
                    tx.onabort = () => reject(tx.error);
                });
            }

            getBook(id) { return this.dbRequest('readonly', s => s.get(id)); }
            putBook(book) { return this.dbRequest('readwrite', s => s.put(book)); }
            deleteBook(id) { return this.dbRequest('readwrite', s => s.delete(id)); }

            // Stored books, most recently opened first
            async listBooks() {
                const books = await this.dbRequest('readonly', s => s.getAll());
                return books.sort((a, b) => b.lastOpened - a.lastOpened);
            }

            async saveProgress() {
                const book = await this.getBook(this.fileHash);
                if (!book) return;
                book.chapterIndex = this.currentChapterIndex;
                book.lastOpened = Date.now();
                await this.putBook(book);
            }

            // Load a new file and store it
            async loadEPUB(file) {
                const id = await this.generateFileHash(file);
                let existing = null;
                try {
                    existing = await this.getBook(id);
                } catch (e) {
                    console.warn('Could not read stored books:', e);
                }
                await this.parseEPUB(await file.arrayBuffer(), id, existing ? existing.chapterIndex : 0);
                try {
                    await this.putBook({
                        id,
                        name: file.name,
                        title: this.title,
                        author: this.author,
                        blob: file,
                        chapterIndex: this.currentChapterIndex,
                        lastOpened: Date.now()
                    });
                } catch (e) {
                    console.warn('Could not store EPUB:', e);
                }
            }

            // Load a previously stored book
            async openStored(id) {
                const book = await this.getBook(id);
                if (!book) throw new Error('Book not found in storage');
                await this.parseEPUB(await book.blob.arrayBuffer(), id, book.chapterIndex);
                book.lastOpened = Date.now();
                await this.putBook(book);
            }

            // Parse EPUB data
            async parseEPUB(arrayBuffer, id, savedChapterIndex) {
                try {
                    this.fileHash = id;
                    const zip = new JSZip();
                    await zip.loadAsync(arrayBuffer);

                    // Get the OPF file path from container.xml
                    const containerXml = await zip.file('META-INF/container.xml').async('string');
                    const parser = new DOMParser();
                    const containerDoc = parser.parseFromString(containerXml, 'application/xml');
                    const opfPath = containerDoc.querySelector('rootfile').getAttribute('full-path');

                    // Parse OPF file to get spine (chapter order)
                    const opfContent = await zip.file(opfPath).async('string');
                    const opfDoc = parser.parseFromString(opfContent, 'application/xml');
                    const opfDir = opfPath.substring(0, opfPath.lastIndexOf('/') + 1);

                    // Extract metadata
                    const titleElement = opfDoc.querySelector('[property="dcterms:title"], dc\\:title');
                    const title = titleElement ? titleElement.textContent : 'Unknown Title';
                    const authorElement = opfDoc.querySelector('[property="dcterms:creator"], dc\\:creator');
                    const author = authorElement ? authorElement.textContent : 'Unknown Author';

                    // Get spine items (reading order)
                    const spine = opfDoc.querySelector('spine');
                    const spineItems = spine.querySelectorAll('itemref');
                    const manifest = opfDoc.querySelector('manifest');

                    this.chapters = [];
                    spineItems.forEach(item => {
                        const idRef = item.getAttribute('idref');
                        const manifestItem = manifest.querySelector(`item[id="${idRef}"]`);
                        if (manifestItem) {
                            const href = manifestItem.getAttribute('href');
                            this.chapters.push({
                                id: idRef,
                                href: opfDir + href,
                                label: manifestItem.getAttribute('id')
                            });
                        }
                    });

                    this.zip = zip;
                    this.title = title;
                    this.author = author;

                    // Restore reading position
                    this.currentChapterIndex = Math.max(0, Math.min(savedChapterIndex || 0, this.chapters.length - 1));

                    return true;
                } catch (error) {
                    console.error('Error loading EPUB:', error);
                    throw error;
                }
            }

            // Load and display a chapter
            async loadChapter(index) {
                try {
                    if (index < 0 || index >= this.chapters.length) {
                        return;
                    }

                    const chapter = this.chapters[index];
                    let htmlContent = await this.zip.file(chapter.href).async('string');

                    // Extract content from body tag
                    const parser = new DOMParser();
                    const doc = parser.parseFromString(htmlContent, 'text/html');
                    const body = doc.querySelector('body') || doc.documentElement;

                    // Create content div with chapter HTML
                    const contentDiv = document.createElement('div');
                    contentDiv.innerHTML = body.innerHTML;

                    // Fix image paths - convert relative paths to blob URLs
                    const images = contentDiv.querySelectorAll('img');
                    for (let img of images) {
                        const src = img.getAttribute('src');
                        if (src && !src.startsWith('data:') && !src.startsWith('http')) {
                            const chapterDir = chapter.href.substring(0, chapter.href.lastIndexOf('/') + 1);
                            const imagePath = chapterDir + src;
                            try {
                                const imageFile = this.zip.file(imagePath);
                                if (imageFile) {
                                    const imageBlob = await imageFile.async('blob');
                                    img.src = URL.createObjectURL(imageBlob);
                                }
                            } catch (e) {
                                console.warn('Could not load image:', imagePath);
                            }
                        }
                    }

                    this.currentChapterIndex = index;
                    this.saveProgress().catch(e => console.warn('Could not save progress:', e));

                    return {
                        title: chapter.label,
                        content: contentDiv
                    };
                } catch (error) {
                    console.error('Error loading chapter:', error);
                    throw error;
                }
            }
        }

        // Initialize
        const reader = new EPUBReader();
        const epubFileInput = document.getElementById('epubFile');
        const uploadSection = document.getElementById('uploadSection');
        const readerSection = document.getElementById('readerSection');
        const uploadStatus = document.getElementById('uploadStatus');
        const bookInfo = document.getElementById('bookInfo');
        const chapterContent = document.getElementById('chapterContent');
        const chapterNav = document.getElementById('chapterNav');
        const loadingIndicator = document.getElementById('loadingIndicator');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        const prevBtn2 = document.getElementById('prevBtn2');
        const nextBtn2 = document.getElementById('nextBtn2');
        const backBtn = document.getElementById('backBtn');

        // File upload handler
        epubFileInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            uploadStatus.innerHTML = '<div class="loading">Loading EPUB...</div>';

            try {
                await reader.loadEPUB(file);

                uploadStatus.innerHTML = `<div class="success">✓ EPUB loaded successfully!</div>`;
                bookInfo.innerHTML = `
                    <div class="book-info">
                        <strong>Title:</strong> ${escapeHtml(reader.title)}<br>
                        <strong>Author:</strong> ${escapeHtml(reader.author)}<br>
                        <strong>Chapters:</strong> ${reader.chapters.length}
                    </div>
                `;

                showView('reader');

                await displayChapter();
            } catch (error) {
                uploadStatus.innerHTML = `<div class="error">Error loading EPUB: ${escapeHtml(error.message)}</div>`;
            }
        });

        async function displayChapter() {
            loadingIndicator.style.display = 'block';
            chapterContent.innerHTML = '';

            try {
                const chapter = await reader.loadChapter(reader.currentChapterIndex);
                chapterContent.innerHTML = '';
                chapterContent.appendChild(chapter.content);
                
                updateNavigation();
                loadingIndicator.style.display = 'none';
            } catch (error) {
                chapterContent.innerHTML = `<div class="error">Error loading chapter: ${escapeHtml(error.message)}</div>`;
                loadingIndicator.style.display = 'none';
            }
        }

        function updateNavigation() {
            const total = reader.chapters.length;
            const current = reader.currentChapterIndex + 1;
            chapterNav.textContent = `Chapter ${current} of ${total}`;

            prevBtn.disabled = reader.currentChapterIndex === 0;
            nextBtn.disabled = reader.currentChapterIndex === total - 1;
            prevBtn2.disabled = reader.currentChapterIndex === 0;
            nextBtn2.disabled = reader.currentChapterIndex === total - 1;
        }

        prevBtn.addEventListener('click', async () => {
            if (reader.currentChapterIndex > 0) {
                reader.currentChapterIndex--;
                await displayChapter();
            }
        });

        nextBtn.addEventListener('click', async () => {
            if (reader.currentChapterIndex < reader.chapters.length - 1) {
                reader.currentChapterIndex++;
                await displayChapter();
            }
        });

        prevBtn2.addEventListener('click', async () => {
            if (reader.currentChapterIndex > 0) {
                reader.currentChapterIndex--;
                await displayChapter();
            }
        });

        nextBtn2.addEventListener('click', async () => {
            if (reader.currentChapterIndex < reader.chapters.length - 1) {
                reader.currentChapterIndex++;
                await displayChapter();
            }
        });

        backBtn.addEventListener('click', () => {
            showView('upload');
            epubFileInput.value = '';
            uploadStatus.innerHTML = '';
            bookInfo.innerHTML = '';
            reader.epub = null;
            reader.chapters = [];
        });

        // Views: 'upload', 'reader' or 'library'
        const librarySection = document.getElementById('librarySection');
        const libraryList = document.getElementById('libraryList');

        function showView(name) {
            uploadSection.style.display = name === 'upload' ? 'block' : 'none';
            readerSection.classList.toggle('active', name === 'reader');
            librarySection.style.display = name === 'library' ? 'block' : 'none';
        }

        function route() {
            if (location.hash === '#library') {
                showView('library');
                renderLibrary();
            } else {
                showView(reader.chapters.length ? 'reader' : 'upload');
            }
        }

        async function openStoredBook(id) {
            await reader.openStored(id);
            location.hash = '';
            showView('reader');
            await displayChapter();
        }

        async function renderLibrary() {
            libraryList.innerHTML = '<div class="loading">Loading...</div>';
            let books;
            try {
                books = await reader.listBooks();
            } catch (error) {
                libraryList.innerHTML = `<div class="error">Could not read library: ${escapeHtml(error.message)}</div>`;
                return;
            }
            if (!books.length) {
                libraryList.innerHTML = '<div class="loading">No stored books yet.</div>';
                return;
            }
            libraryList.innerHTML = '';
            for (const book of books) {
                const item = document.createElement('div');
                item.className = 'library-item';
                item.innerHTML = `
                    <div>
                        <div class="library-item-title">${escapeHtml(book.title)}</div>
                        <div class="library-item-meta">${escapeHtml(book.author)} · chapter ${book.chapterIndex + 1} · last opened ${escapeHtml(new Date(book.lastOpened).toLocaleString())}</div>
                    </div>
                    <div class="library-item-actions">
                        <button class="btn btn--primary">Open</button>
                        <button class="btn btn--secondary">Delete</button>
                    </div>
                `;
                const [openBtn, deleteBtn] = item.querySelectorAll('button');
                openBtn.addEventListener('click', async () => {
                    try {
                        await openStoredBook(book.id);
                    } catch (error) {
                        libraryList.insertAdjacentHTML('afterbegin', `<div class="error">Error opening book: ${escapeHtml(error.message)}</div>`);
                    }
                });
                deleteBtn.addEventListener('click', async () => {
                    await reader.deleteBook(book.id);
                    if (reader.fileHash === book.id) {
                        reader.chapters = [];
                        reader.fileHash = null;
                    }
                    renderLibrary();
                });
                libraryList.appendChild(item);
            }
        }

        window.addEventListener('hashchange', route);

        // On page open, resume the last opened book
        (async () => {
            if (location.hash !== '#library') {
                try {
                    const [last] = await reader.listBooks();
                    if (last) {
                        await openStoredBook(last.id);
                        return;
                    }
                } catch (error) {
                    console.warn('Could not resume last book:', error);
                }
            }
            route();
        })();

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, m => map[m]);
        }
    </script>
</body>
</html>
